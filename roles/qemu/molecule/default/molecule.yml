---
# L1 molecule covers Debian only (fleet convention). On an Apple Silicon
# host the container is arm64, so this scenario proves the aarch64 Debian
# branch (qemu-system-arm + qemu-efi-aarch64). The x86_64 branch + real
# /dev/kvm are covered by L2's cloud path (`./test` -> amun/test debian
# --cloud --kvm) and Arch by `./test arch` — same reasoning as amun-xfcemin
# (amd64 emulation under Docker Desktop is broken without Rosetta).
driver:
  name: docker
platforms:
  - name: qemu-test
    image: geerlingguy/docker-debian12-ansible:latest
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    command: /usr/lib/systemd/systemd
    pre_build_image: true
provisioner:
  name: ansible
  config_options:
    defaults:
      roles_path: ${MOLECULE_PROJECT_DIRECTORY}/..
verifier:
  name: ansible
scenario:
  test_sequence:
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
